      <div id="s05" data-composition-id="s05" data-width="1920" data-height="1080"></div>
      <script>
        (function () {
          /*CUES*/ const CUES = {"L36":[0,8.194,"Now here's where it gets weird. This prediction system isn't just for tickling. It's running all the time, on almost everything you do."],"L37":[8.574,16.311,"Right now, your eyes are jumping around this screen several times a second. Every jump should make the whole world lurch. But it doesn't."],"L38":[16.711,21.767,"Your brain predicts each eye movement, and cancels out the motion before you ever notice it."],"L39":[22.147,29.467,"It's not just humans, either. A cricket's chirp is incredibly loud. Loud enough to overwhelm its own sensitive ears."],"L40":[29.847,37.435,"So every time it chirps, a single nerve cell sends a signal that dials down its own hearing, perfectly timed to each chirp."],"L41":[37.935,44.309,"Even your own voice gets this treatment. When you talk, your brain turns down its response to the sound of you."],"L41a":[44.909,51.242,"Which raises a fun question. Why are we ticklish in the first place? Honestly, nobody knows for sure."],"L41b":[51.692,65.092,"Some of the most ticklish spots, like your neck, your ribs, and the soles of your feet, are also some of the most vulnerable. So one idea is that tickling is an alarm, tuned to anything crawling or poking where it shouldn't."],"L41c":[65.472,71.691,"Another idea is that it's social. Tickling is one of the very first games parents play with babies."],"L41d":[72.071,84.375,"And it's not just us. When scientists tickle rats, they let out chirps too high-pitched for us to hear. Some researchers think it's a kind of laughter. The rats even chase the hand, asking for more."],"L41e":[84.875,93.181,"Alarm or game, a tickle only works when it comes from the outside world. Which is exactly why your brain filters out the inside."],"L42":[93.881,100.936,"But all this cancelling has a hidden cost. And a 2003 experiment revealed it in a very relatable way."],"L43":[101.436,111.922,"Researchers sat pairs of people across from each other. One person pressed down on the other's finger. Then the second person had to press back with exactly the same force."],"L44":[112.302,115.391,"Back and forth they went. Everyone was trying to be fair."],"L45":[115.791,121.351,"But the force kept climbing. On average, about thirty-eight percent harder, every single turn."],"L46":[121.951,133.443,"Nobody was cheating. Your brain dampens the feeling of your own push, so it always feels weaker than it really is. To match what you felt, you push harder. And so does the other person."],"L47":[133.823,139.113,"Which means the next time someone says, you hit me harder! They might actually be telling the truth."]}; const DUR = 140.113; /*ENDCUES*/
          const { C, P, BG, person, text, path, rect, line, circ, ell, g, at } = R;

          const S = R.scene("s05");

          // a1 — it gets weird
          let spiral = "M960,540";
          for (let i = 0; i < 260; i++) { const a = i * 0.18, r = 6 + i * 4.6; spiral += ` L${960 + Math.cos(a) * r},${540 + Math.sin(a) * r}`; }
          S.add("a1",
            BG.flat("#6B4FA0") + W("s05-a1-sp", path(spiral, "none", 34, "#8E6BC8")) +

            `<div class="ttl" id="s05-a1-t" style="top:80px;font-size:120px;color:#FBF8F1">it gets weird</div>`);

          // a2 — always on

          // b — eyes darting, world lurching

          S.add("b",

          // c — the cancellation equation
          S.add("c",

            W("s05-c-plus", text(0, 0, "+", 160), at(640, 480)) +
            W("s05-c-2", P.brain(null, 0, 0, 0.6, { face: true }) + P.arrow(null, 120, 150, -120, 150, 10, C.purple), at(960, 450)) + text(960, 760, "BRAIN CANCELS IT", 54) +
            W("s05-c-eq", text(0, 0, "=", 160), at(1280, 480)) +
            W("s05-c-3", rect(-170, -120, 340, 240, C.sky, 16, 7) + rect(-60, -10, 120, 100, C.wall, 4, 6) + path("M-80,0 L0,-60 L80,0Z", C.red, 6), at(1590, 460)) + text(1590, 760, "STEADY WORLD", 54) +
            P.check("s05-c-ok", 1590, 260, 1));

          // d — cricket at night
          S.add("d",

          // e — one nerve cell dials down hearing
          S.add("e",

            P.neuron("s05-e-n", 760, 300, 1.4) + text(760, 150, "ONE NERVE CELL", 60) +
            text(250, 600, "CHIRP", 52, C.ink, "start") + text(250, 800, "HEARING", 52, C.ink, "start") +
            line(500, 640, 1760, 640, 4, C.gray) + line(500, 820, 1760, 820, 4, C.gray) +
            W("s05-e-ch", [0, 1, 2, 3, 4].map((i) => rect(560 + i * 240, 560, 90, 80, C.green, 8, 5)).join("")) +
            W("s05-e-hr", path("M500,760 " + [0, 1, 2, 3, 4].map((i) => `L${560 + i * 240},760 L${575 + i * 240},810 L${635 + i * 240},810 L${650 + i * 240},760`).join(" ") + " L1760,760", "none", 8, C.purple)) +
            W("s05-e-head", rect(480, 520, 50, 360, "rgba(228,72,59,.25)", 10, 0)));

          // f — your own voice
          S.add("f",
            BG.room({ wall: "#F3E3C9" }) +
            person("s05f", { x: 560, y: 680, s: 1.4, mouth: "o" }) +
            W("s05-f-w", [1, 2, 3].map((k) => path(`M${700 + k * 50},${330 - k * 30} Q${760 + k * 70},${380} ${700 + k * 50},${430 + k * 30}`, "none", 9, C.orange)).join("")) +
            P.thought("s05-f-th", 1320, 360, 640, 400, P.brain(null, -140, 20, 0.45, { face: true }) + P.knob(null, 150, 0, 0.6, "")) +
            lbl("s05-f-l", 1320, 800, 600, "YOUR VOICE: TURNED DOWN", C.white, C.ink, 50));

          // g — why ticklish?
          S.add("g",
            BG.paper() +
            person("s05g", { x: 960, y: 740, s: 1.3, mouth: "wavy" }) +
            P.question("s05-g-q1", 620, 380, 0.8) + P.question("s05-g-q2", 1300, 340, 1, C.red) + P.question("s05-g-q3", 1420, 600, 0.6),
            `<div class="ttl" id="s05-g-t" style="top:60px;font-size:110px">why are we ticklish?</div>` +
            `<div class="ttl" id="s05-g-s" style="top:960px;font-size:56px;color:#6b665d">honestly? nobody knows for sure</div>`);

          // h — vulnerable spots
          const spot = (id, x, y) => W(id, circ(0, 0, 46, "rgba(228,72,59,.35)", 6, C.red), at(x, y));
          S.add("h",
            BG.flat("#FFF1E0") +
            person("s05h", { x: 760, y: 600, s: 1.55, mouth: "flat", shirt: C.yellow }) +
            spot("s05-h-s1", 760, 360) + spot("s05-h-s2", 715, 470) + spot("s05-h-s3", 805, 470) + spot("s05-h-s4", 718, 868) + spot("s05-h-s5", 802, 868) +
            lbl("s05-h-l1", 1240, 360, 240, "NECK") + lbl("s05-h-l2", 1240, 480, 240, "RIBS") + lbl("s05-h-l3", 1240, 860, 260, "FEET") +
            W("s05-h-sp", P.spider(null, 0, 0, 1.2) + line(0, -30, 0, -500, 3), at(1560, 520)) +
            W("s05-h-al", path("M-80,40 Q-80,-90 0,-90 Q80,-90 80,40 Z", C.red, 8) + rect(-110, 40, 220, 40, C.gray, 10, 7), at(300, 280)));

          // i — parent + baby
          S.add("i",
            BG.room({ wall: "#FCE4EC", floor: "#D9A6B5" }) +
            person("s05p", { x: 760, y: 640, s: 1.4, hair: "ponytail", hairColor: "#7A4A2A", shirt: C.teal, mouth: "grin" }) +
            P.baby("s05-ib", 1130, 640, 1.5) +
            g("s05-i-h", P.heart(null, 1100, 300, 0.9) + P.heart(null, 1300, 380, 0.7) + P.heart(null, 960, 260, 0.6)) +
            text(1130, 900, "one of the first games", 56, "#6b665d"));

          // j — rats laugh
          S.add("j",
            BG.flat("#E9F1F6") +
            W("s05-j-rat", P.rat("s05-jr", 0, 0, 1.6), at(820, 640)) +
            W("s05-j-hand", rect(60, -40, 160, 80, C.purple, 16, 7) + P.hand(null, 0, 0, 0.8, 180), at(1260, 600)) +
            W("s05-j-us", path("M420,360 q20,-20 40,0 t40,0 t40,0 t40,0 M380,300 q20,-20 40,0 t40,0 t40,0", "none", 7, C.purple) +
              text(470, 230, "chirp chirp", 54, C.purple)) +
            lbl("s05-j-l", 960, 950, 760, "TOO HIGH-PITCHED FOR HUMANS", C.white, C.ink, 50) +
            W("s05-j-more", P.bubble(null, 0, 0, 300, 120, text(0, 4, "more!", 64), "left"), at(1100, 300)));

          // k — outside vs inside
          S.add("k",
            BG.paper() +
            circ(960, 560, 280, "#FFF3C4", 9) + person("s05k", { x: 960, y: 640, s: 0.9, mouth: "smile" }) + text(960, 900, "YOU", 52) +
            W("s05-k-out", [[-1, -1], [1, -1], [-1, 1], [1, 1]].map(([dx, dy]) => P.arrow(null, 960 + dx * 760, 560 + dy * 380, 960 + dx * 330, 560 + dy * 170, 12, C.red)).join("")) +
            W("s05-k-in", P.arrow(null, 960, 520, 1140, 450, 10, C.gray) + P.mute(null, 1170, 420, 0.4)) +
            lbl("s05-k-l1", 330, 160, 460, "OUTSIDE = LOUD", "#FFE1DC", C.red) + lbl("s05-k-l2", 1590, 160, 460, "INSIDE = QUIET", C.gray2, C.ink));

          // l — the hidden cost, 2003
          S.add("l",
            BG.flat("#FFF4D6") +
            W("s05-l-tag", line(0, -260, 0, -170, 5) + path("M-160,-170 L160,-170 L200,-90 L200,200 L-200,200 L-200,-90 Z", C.yellow, 8) + circ(0, -120, 18, C.white, 6) +
              text(0, 20, "HIDDEN", 70) + text(0, 110, "COST", 70), at(760, 520)) +
            P.calendar("s05-l-cal", 1380, 560, 1.1, "2003"));

          // m/n — the finger-pressing experiment
          S.add("m",
            BG.room({ wall: "#E3ECF4", floor: "#8FA3B6", fy: 760 }) +
            person("s05pa", { x: 520, y: 640, s: 1.3, shirt: C.blue, hair: "side", hairColor: C.brown, mouth: "smile" }) +
            person("s05pb", { x: 1400, y: 640, s: 1.3, shirt: C.red, hair: "curly", hairColor: C.ink, mouth: "smile", flip: -1 }) +
            P.table("s05-m-tab", 960, 700, 1200) +
            W("s05-m-pad", rect(-90, -40, 180, 40, C.gray2, 10, 6) + P.hand(null, 30, -60, 0.45, 180) , at(960, 700)) +
            W("s05-m-push", P.arrow(null, 0, -320, 0, -150, 12, C.red), at(960, 640)) +
            P.scale("s05-m-sc", 960, 380, 0.7) +
            W("s05-m-fair", text(0, 0, "FAIR?", 70), at(960, 90)));

          // o — the escalation chart
          const bars = Array.from({ length: 8 }, (_, i) => Math.pow(1.38, i));
          const bmax = bars[7];
          S.add("o",
            BG.paper() +
            line(260, 900, 1700, 900, 8) + line(260, 900, 260, 160, 8) +
            text(150, 530, "FORCE", 56, C.ink, "middle", `transform="rotate(-90 150 530)"`) +
            bars.map((b, i) => W(`s05-o-b${i}`, rect(320 + i * 170, 900 - (b / bmax) * 700, 120, (b / bmax) * 700, i % 2 ? C.red : C.blue, 8, 6))).join("") +
            bars.map((_, i) => text(380 + i * 170, 950, `${i + 1}`, 44)).join("") + text(980, 1020, "TURN", 44) +
            lbl("s05-o-l", 700, 200, 640, "≈ +38% EVERY TURN", "#FFE1DC", C.red, 64));

          // p — why: push vs feel
          const arr = (id, x, y, len, col, label) => W(id, rect(0, -36, len, 72, col, 14, 7) + path(`M${len},-70 L${len + 90},0 L${len},70 Z`, col, 7) + text(-30, 0, label, 52, C.ink, "end"), at(x, y));
          S.add("p",
            BG.paper() +
            arr("s05-p-a1", 760, 300, 820, C.blue, "WHAT YOU PUSH") +
            arr("s05-p-a2", 760, 540, 380, "#9EBCE5", "WHAT YOU FEEL") +
            arr("s05-p-a3", 760, 780, 820, C.red, "WHAT THEY FEEL") +
            W("s05-p-muff", P.brain(null, 0, 0, 0.32, { face: true }) + P.mute(null, 120, -10, 0.45), at(1420, 540)));

          // q — the backseat
          S.add("q",
            BG.flat("#BFE3F1") + rect(-200, 820, 2320, 400, "#9AA79A", 0, 0) +

            P.bubble("s05-q-b", 520, 200, 720, 170, text(0, 4, "YOU HIT ME HARDER!", 70, C.red), "right") +
            W("s05-q-halo", ell(1130, 230, 70, 18, "none", 10, C.yellow)),
            `<div class="ttl" id="s05-q-t" style="top:930px;font-size:80px">...they might be right</div>`);

          S.mount();
          const tl = gsap.timeline({ paused: true });
          const t = { a1: 0, a2: q("L36", "This prediction"), b: q("L37"), c: q("L38"), d: q("L39"), e: q("L40"), f: q("L41"),
            g: q("L41a"), h: q("L41b"), i: q("L41c"), j: q("L41d"), k: q("L41e"), l: q("L42"), m: q("L43"), o: q("L45"), p: q("L46"), qq: q("L47") };
          R.shots(tl, [["#s05-a1", 0], ["#s05-a2", t.a2, "pop"], ["#s05-b", t.b, "whipL"], ["#s05-c", t.c, "pop"], ["#s05-d", t.d, "fade"], ["#s05-e", t.e, "whipL"],
            ["#s05-f", t.f, "whipL"], ["#s05-g", t.g, "pop"], ["#s05-h", t.h, "whipL"], ["#s05-i", t.i, "whipL"], ["#s05-j", t.j, "whipL"], ["#s05-k", t.k, "pop"],
            ["#s05-l", t.l, "up"], ["#s05-m", t.m, "whipL"], ["#s05-o", t.o, "pop"], ["#s05-p", t.p, "whipL"], ["#s05-q", t.qq, "whipL"]], DUR);
          R.boil(tl, "#s05-cam .boil", "s05", 0, DUR);

          // a1 — weird
          sfx("glitch", 0); sfx("boing", 0.3, 0.6);
          tl.fromTo("#s05-a1-sp", { rotation: 0, svgOrigin: "960 540" }, { rotation: 200, svgOrigin: "960 540", duration: t.a2, ease: "none" }, 0);
          R.words(tl, "#s05-a1-t", 0.1, 0.1, { rot: 12 });
          R.expr(tl, "s05w", { brows: "up", look: [0, -8] }, 0);
          R.wiggle(tl, "#s05w-head", 0.5, t.a2 - 0.6, 10, 0.2, "50% 100%");
          R.push(tl, "#s05-a1", 0, t.a2, 1, 1.1);

          // a2 — always on
          tl.fromTo("#s05-a2-orb", { rotation: 0, svgOrigin: "0 0" }, { rotation: 120, svgOrigin: "0 0", duration: t.b - t.a2, ease: "none" }, t.a2);

          gsap.set("#s05-a2-l", { opacity: 0 });

          R.push(tl, "#s05-a2", t.a2, t.b - t.a2, 1, 1.06);

          // b — saccades
          const sac = [[0, 0], [120, -60], [-100, 40], [80, 70], [-130, -50], [60, -20], [-40, 80], [110, 10]];

          gsap.set(["#s05-b-l1", "#s05-b-l2"], { opacity: 0 });
          for (let i = 0; i < 18; i++) {
            const [x, y] = sac[i % sac.length];

            if (tt >= lurch && tt < stable) {

          tl.to("#s05-b-l1", { opacity: 0, duration: 0.1 }, stable);
          R.pop(tl, "#s05-b-l2", stable); sfx("ding", stable, 0.5);
          R.push(tl, "#s05-b", t.b, t.c - t.b, 1, 1.04);

          // c — equation
          ["#s05-c-1", "#s05-c-plus", "#s05-c-2", "#s05-c-eq", "#s05-c-3", "#s05-c-ok"].forEach((s, i) => {
            gsap.set(s, { opacity: 0 });
            R.pop(tl, s, t.c + 0.2 + i * 0.55); sfx("pop", t.c + 0.2 + i * 0.55, 0.4);
          });
          sfx("ding", t.c + 0.2 + 5 * 0.55, 0.5);
          R.push(tl, "#s05-c", t.c, t.d - t.c, 1, 1.05);

          // d — cricket
          gsap.set(["#s05-d-chirp", "#s05-d-ear"], { opacity: 0 });
          const ch = q("L39", "A cricket");
          for (let i = 0; i < 6; i++) {
            const tt = ch + i * 0.9;
            tl.fromTo("#s05-d-waves", { opacity: 1, scale: 0.7, transformOrigin: "100% 50%" }, { opacity: 0, scale: 1.3, duration: 0.6, ease: "power1.out" }, tt);
            R.wiggle(tl, "#s05-dc-wings", tt, 0.4, 6, 0.05);
            sfx("chirp", tt, 0.8);
          }
          R.pop(tl, "#s05-d-chirp", q("L39", "incredibly loud")); R.shake(tl, "#s05-d-chirp", q("L39", "incredibly loud") + 0.3, 0.5, 10);
          R.fadeIn(tl, "#s05-d-ear", q("L39", "Loud enough"));
          R.push(tl, "#s05-d", t.d, t.e - t.d, 1.0, 1.1, 0, 0, 0, 20);

          // e — neuron + sync graph
          tl.fromTo("#s05-e-n-pulse", { x: 0 }, { x: 320, duration: 0.6, ease: "none", repeat: 8 }, t.e + 0.4);
          tl.fromTo("#s05-e-head", { x: 0 }, { x: 1260, duration: q("L40", "end") - t.e - 0.5, ease: "none" }, t.e + 0.6);
          R.draw(tl, "#s05-e-hr path", t.e + 0.6, q("L40", "end") - t.e - 0.5, "none");
          tl.fromTo("#s05-e-ch rect", { opacity: 0.15 }, { opacity: 1, duration: 0.2, stagger: (q("L40", "end") - t.e - 0.5) / 5.2 }, t.e + 0.9);
          for (let i = 0; i < 5; i++) sfx("chirp", t.e + 0.9 + i * (q("L40", "end") - t.e - 0.5) / 5.2, 0.4);
          R.push(tl, "#s05-e", t.e, t.f - t.e, 1, 1.05);

          // f — own voice

          tl.fromTo("#s05-f-w path", { opacity: 0 }, { opacity: 1, duration: 0.2, stagger: 0.15, repeat: 6, yoyo: true }, t.f + 0.3);
          gsap.set(["#s05-f-th", "#s05-f-l"], { opacity: 0 });
          R.pop(tl, "#s05-f-th", q("L41", "When you talk")); sfx("pop", q("L41", "When you talk"), 0.5);
          R.pop(tl, "#s05-f-l", q("L41", "turns down")); sfx("down", q("L41", "turns down"), 0.6);
          R.push(tl, "#s05-f", t.f, t.g - t.f, 1, 1.06);

          // g — why ticklish?
          R.words(tl, "#s05-g-t", t.g + 0.1, 0.08);
          R.pose(tl, "s05g", { armL: 50, foreL: 90, armR: 50, foreR: 90 }, t.g + 0.3, 0.3);
          R.expr(tl, "s05g", { brows: "worried" }, t.g + 0.3);
          ["#s05-g-q1", "#s05-g-q2", "#s05-g-q3"].forEach((s, i) => { gsap.set(s, { opacity: 0 }); R.pop(tl, s, t.g + 0.6 + i * 0.3); sfx("pop", t.g + 0.6 + i * 0.3, 0.4); });
          gsap.set("#s05-g-s", { opacity: 0 });
          R.fadeIn(tl, "#s05-g-s", q("L41a", "nobody knows"));
          R.push(tl, "#s05-g", t.g, t.h - t.g, 1, 1.06);

          // h — vulnerable spots, spider, alarm
          const sp = [["s1", "neck"], ["s2", "ribs"], ["s3", "ribs"], ["s4", "soles"], ["s5", "soles"]];
          sp.forEach(([k, w], i) => { gsap.set(`#s05-h-${k}`, { opacity: 0 }); R.pop(tl, `#s05-h-${k}`, q("L41b", w) + (i % 2) * 0.1); });
          [["l1", "neck"], ["l2", "ribs"], ["l3", "soles"]].forEach(([k, w]) => { gsap.set(`#s05-h-${k}`, { opacity: 0 }); R.pop(tl, `#s05-h-${k}`, q("L41b", w)); sfx("pop", q("L41b", w), 0.5); });
          tl.fromTo("#s05-h-sp", { y: -700 }, { y: 0, duration: 1.4, ease: "power1.out" }, q("L41b", "vulnerable"));
          tl.to("#s05-h-sp", { x: -500, y: 120, duration: 2.5, ease: "sine.inOut" }, q("L41b", "So one idea"));
          gsap.set("#s05-h-al", { opacity: 0 });
          R.pop(tl, "#s05-h-al", q("L41b", "alarm")); R.wiggle(tl, "#s05-h-al", q("L41b", "alarm"), 1.4, 12, 0.1); sfx("alarm", q("L41b", "alarm"), 0.4);
          R.expr(tl, "s05h", { mouth: "O", brows: "up", look: [10, 0], sweat: 1 }, q("L41b", "alarm"));
          R.push(tl, "#s05-h", t.h, t.i - t.h, 1, 1.06);

          // i — parent & baby
          R.pose(tl, "s05p", { armR: 75, foreR: 20 }, t.i + 0.2, 0.3);
          for (let k = 0; k < 14; k++) R.pose(tl, "s05p", { foreR: k % 2 ? 5 : 35 }, t.i + 0.5 + k * 0.15, 0.13);
          for (let k = 0; k < 10; k++) tl.to("#s05-ib-m", { scaleY: k % 2 ? 0.6 : 1.1, transformOrigin: "50% 0%", duration: 0.14 }, t.i + 0.5 + k * 0.16);
          R.wiggle(tl, "#s05-ib", t.i + 0.5, 2.0, 5, 0.12);
          tl.fromTo("#s05-i-h > g > g", { y: 60, opacity: 0 }, { y: -40, opacity: 1, duration: 1.0, stagger: 0.3 }, t.i + 0.8);
          sfx("tickle", t.i + 0.5, 0.6); sfx("sparkle", t.i + 0.9, 0.4);
          R.push(tl, "#s05-i", t.i, t.j - t.i, 1, 1.06);

          // j — rats
          gsap.set(["#s05-j-us", "#s05-j-l", "#s05-j-more"], { opacity: 0 });
          R.slideIn(tl, "#s05-j-hand", t.j + 0.5, 400, 0, 0.4);
          const rk = q("L41d", "tickle rats");
          for (let k = 0; k < 10; k++) tl.to("#s05-j-hand", { x: k % 2 ? -30 : -80, y: k % 2 ? -10 : 20, duration: 0.14 }, rk + k * 0.15);
          R.wiggle(tl, "#s05-j-rat", rk + 0.2, 1.5, 6, 0.1);
          R.pop(tl, "#s05-j-us", q("L41d", "chirps")); sfx("squeak", q("L41d", "chirps"), 0.5); sfx("squeak", q("L41d", "chirps") + 0.3, 0.4);
          R.pop(tl, "#s05-j-l", q("L41d", "too high"));
          const ch2 = q("L41d", "chase");
          tl.to("#s05-j-hand", { x: 500, duration: 1.0, ease: "power2.in" }, ch2 - 0.4);
          tl.to("#s05-j-rat", { x: 360, duration: 1.2, ease: "power2.inOut" }, ch2);
          R.pop(tl, "#s05-j-more", q("L41d", "asking")); sfx("squeak", q("L41d", "asking"), 0.6);
          R.push(tl, "#s05-j", t.j, t.k - t.j, 1, 1.06);

          // k — outside vs inside
          gsap.set(["#s05-k-l1", "#s05-k-l2", "#s05-k-in"], { opacity: 0 });
          tl.fromTo("#s05-k-out", { opacity: 0, scale: 1.3, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.5 }, q("L41e", "outside world") - 0.2);
          R.pop(tl, "#s05-k-l1", q("L41e", "outside world")); sfx("whoosh", q("L41e", "outside world") - 0.2, 0.5);
          R.pop(tl, "#s05-k-in", q("L41e", "filters")); R.pop(tl, "#s05-k-l2", q("L41e", "inside")); sfx("down", q("L41e", "filters"), 0.6);
          R.push(tl, "#s05-k", t.k, t.l - t.k, 1, 1.05);

          // l — hidden cost
          tl.fromTo("#s05-l-tag", { rotation: -25, transformOrigin: "50% 0%" }, { rotation: 0, transformOrigin: "50% 0%", duration: 1.4, ease: "elastic.out(1,0.3)" }, t.l + 0.1);
          sfx("swish", t.l + 0.1, 0.5);
          gsap.set("#s05-l-cal", { opacity: 0 });
          R.pop(tl, "#s05-l-cal", q("L42", "2003")); sfx("stamp", q("L42", "2003"));
          R.push(tl, "#s05-l", t.l, t.m - t.l, 1, 1.06);

          // m — pressing back and forth (L43 + L44)
          R.idle(tl, "s05pa", t.m, t.o, 51); R.idle(tl, "s05pb", t.m, t.o, 52);
          R.pose(tl, "s05pa", { armR: 70, foreR: 20 }, t.m + 0.3, 0.3);
          R.pose(tl, "s05pb", { armR: 70, foreR: 20 }, t.m + 0.3, 0.3);
          gsap.set(["#s05-m-push", "#s05-m-fair"], { opacity: 0 });
          const press = (tt, who, k) => {
            const sgn = who === "a" ? -1 : 1;
            tl.set("#s05-m-push", { opacity: 1, x: sgn * 120 }, tt);
            tl.fromTo("#s05-m-push", { y: -40 }, { y: 0, duration: 0.25, ease: "power2.in" }, tt);
            tl.set("#s05-m-push", { opacity: 0 }, tt + 0.6);
            tl.to("#s05-m-sc-beam", { rotation: sgn * 10 * k, svgOrigin: "0 -260", duration: 0.3, ease: "back.out(2)" }, tt);
            tl.to("#s05-m-sc-panL", { rotation: -sgn * 10 * k, svgOrigin: "-220 -260", duration: 0.3 }, tt);
            tl.to("#s05-m-sc-panR", { rotation: -sgn * 10 * k, svgOrigin: "220 -260", duration: 0.3 }, tt);
            R.pose(tl, who === "a" ? "s05pa" : "s05pb", { armR: 55, foreR: 35 }, tt, 0.2);
            R.pose(tl, who === "a" ? "s05pa" : "s05pb", { armR: 70, foreR: 20 }, tt + 0.4, 0.2);
            sfx("thud", tt, 0.4 + 0.08 * k);
          };
          press(q("L43", "One person"), "a", 0.5);
          press(q("L43", "Then the second"), "b", 0.5);
          const bf = q("L44");
          for (let k = 0; k < 4; k++) press(bf + k * 0.7, k % 2 ? "b" : "a", 0.6);
          R.pop(tl, "#s05-m-fair", q("L44", "fair") - 0.2); sfx("ding", q("L44", "fair"), 0.4);
          R.push(tl, "#s05-m", t.m, t.o - t.m, 1, 1.08);

          // o — escalation
          const bt = (t.p - t.o - 1.2) / 8;
          for (let i = 0; i < 8; i++) {
            gsap.set(`#s05-o-b${i}`, { opacity: 0 });
            tl.fromTo(`#s05-o-b${i}`, { scaleY: 0, opacity: 1, transformOrigin: "50% 100%" }, { scaleY: 1, opacity: 1, duration: 0.35, ease: "back.out(1.6)" }, t.o + 0.3 + i * bt);

          R.push(tl, "#s05-o", t.o, t.p - t.o, 1, 1.06);

          // p — push vs feel
          ["#s05-p-a1", "#s05-p-a2", "#s05-p-a3"].forEach((s) => gsap.set(s, { opacity: 0 }));
          const pa = [q("L46", "dampens"), q("L46", "feels weaker"), q("L46", "And so does")];
          tl.fromTo("#s05-p-a1", { scaleX: 0, opacity: 1, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, pa[0] - 0.6);
          tl.fromTo("#s05-p-a2", { scaleX: 0, opacity: 1, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, pa[1] - 0.4);
          tl.fromTo("#s05-p-a3", { scaleX: 0, opacity: 1, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, pa[2] - 0.6);
          sfx("whoosh", pa[0] - 0.6, 0.4); sfx("whoosh", pa[1] - 0.4, 0.3); sfx("whoosh", pa[2] - 0.6, 0.5);
          gsap.set("#s05-p-muff", { opacity: 0 });
          R.pop(tl, "#s05-p-muff", pa[1]);
          R.push(tl, "#s05-p", t.p, t.qq - t.p, 1, 1.05);

          gsap.set(["#s05-q-b", "#s05-q-halo", "#s05-q-t"], { opacity: 0 });
          R.pose(tl, "s05k1", { armR: 80, foreR: 10 }, t.qq + 0.2, 0.2);
          R.expr(tl, "s05k1", { brows: "angry" }, t.qq + 0.2);
          R.expr(tl, "s05k2", { brows: "worried" }, t.qq + 0.2);
          R.pop(tl, "#s05-q-b", q("L47", "you hit")); sfx("impact", q("L47", "you hit"), 0.5);
          R.shake(tl, "#s05-q-car", q("L47", "you hit"), 0.4, 8);
          R.pop(tl, "#s05-q-halo", q("L47", "They might")); sfx("sparkle", q("L47", "They might"), 0.5);
          R.expr(tl, "s05k2", { mouth: "smirk", brows: "sly" }, q("L47", "They might"));
          R.fadeIn(tl, "#s05-q-t", q("L47", "They might"));
          R.push(tl, "#s05-q", t.qq, DUR - t.qq, 1, 1.08);

          window.__timelines["s05"] = tl;
        })();
      </script>
