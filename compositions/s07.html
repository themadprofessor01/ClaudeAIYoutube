<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "HandSC"; src: url("assets/fonts/PatrickHandSC.woff2") format("woff2"); }
        #s07-cam { position: absolute; inset: 0; overflow: hidden; background: #FBF8F1; }
        #s07-cam .shot { position: absolute; inset: 0; visibility: hidden; }
        #s07-cam .shot > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
        #s07-cam .ttl { position: absolute; left: 0; right: 0; text-align: center; font-family: "HandSC", cursive; color: #272320; }
      </style>
      <div id="s07" data-composition-id="s07" data-width="1920" data-height="1080"></div>
      <script>
        (function () {
          /*CUES*/ const CUES = {"L46":[0,8.498,"So next time, bring a list. Eat before you go. Look at the top and bottom shelves. And check the price per unit, not the big yellow sign."],"L47":[8.998,12.554,"You won't beat every trick. But now, at least, you'll see them coming."],"L48":[12.954,15.903,"And maybe, this time, you'll actually remember the milk."],"L49":[16.703,25.397,"If this changed how you'll walk through the store, subscribe to Randos in 60s for more weird stuff about your brain. See you in the next one."]}; const DUR = 27.997; /*ENDCUES*/
          const { C, P, BG, person, text, path, rect, line, circ, ell, g, at } = R;
          const q = R.cue(CUES);
          const S = R.scene("s07");
          const sfx = (n, t, gn) => R.sfx("s07", n, t, gn);
          const W = (id, inner, tr) => g(null, g(id, inner), tr);
          const row = (id, y, icon, label) => W(id, rect(-560, -70, 1120, 140, C.white, 30, 8) + g(null, icon, at(-460, 0)) + text(-360, 6, label, 66, C.ink, "start") + P.check(null, 470, 0, 0.9), at(1080, y));

          // a — the defence checklist
          S.add("a",
            BG.flat("#E3F3E1") +
            person("s07t", { x: 260, y: 780, s: 1.3, mouth: "smile" }) +
            row("s07-a-1", 200, P.list(null, 0, 0, 0.25, ["milk"]), "bring a list") +
            row("s07-a-2", 400, P.apple(null, 0, 20, 0.7), "eat before you go") +
            row("s07-a-3", 600, P.arrow(null, 0, 40, 0, -40, 8) + P.arrow(null, 0, -40, 0, 40, 8), "look high and low") +
            row("s07-a-4", 800, P.scaleWeight(null, 0, 20, 0.45, "$/kg"), "check the unit price"));

          // b — you'll see them coming
          S.add("b",
            BG.store() + P.shelf(null, 760, 140, 1060, 700, 3, 211) +
            person("s07b", { x: 420, y: 720, s: 1.35, mouth: "smirk" }) +
            W("s07-b-mag", P.magnifier(null, 0, 0, 1.3), at(1240, 400)) +
            W("s07-b-tags", P.bubble(null, 0, 0, 260, 100, text(0, 4, "TRICK!", 54, C.red), "left"), at(1300, 220)) +
            W("s07-b-tags2", P.bubble(null, 0, 0, 260, 100, text(0, 4, "TRICK!", 54, C.red), "left"), at(1600, 620)));

          // c — you remembered the milk
          S.add("c",
            BG.store() + P.checkout(null, 1300, 920, 1.0) +
            person("s07c", { x: 700, y: 720, s: 1.4, mouth: "grin" }) +
            W("s07-c-milk", P.product(null, 0, 0, 1.3, "milk"), at(900, 520)) +
            g("s07-c-sp", P.star(null, 1040, 260, 0.8) + P.star(null, 780, 220, 0.6) + P.star(null, 1080, 560, 0.5)) +
            W("s07-c-rc", P.receipt(null, 0, 0, 0.8, 3, "$1.29"), at(1500, 760)));

          // d — end card
          S.add("d",
            BG.flat("#FCE9B8") +
            Array.from({ length: 14 }, (_, i) => circ(80 + i * 140, i % 2 ? 1010 : 70, 14, "#F8DA92", 0)).join("") +
            person("s07e", { x: 420, y: 760, s: 1.5, mouth: "grin" }) +
            W("s07-d-btn", rect(-260, -70, 520, 140, C.red, 70, 8) + `<g id="s07-d-t1">${text(0, 6, "SUBSCRIBE", 80, C.white)}</g><g id="s07-d-t2" opacity="0">${text(0, 6, "SUBSCRIBED", 74, C.white)}</g>`, at(1200, 620)) +
            W("s07-d-bell", path("M-40,30 Q-44,-50 0,-56 Q44,-50 40,30 L52,44 L-52,44 Z", C.yellow, 7) + circ(0, 56, 10, C.ink, 0) + line(0, -56, 0, -70, 7), at(1560, 620)) +
            W("s07-d-cur", path("M0,0 L0,90 L24,68 L42,108 L60,100 L42,62 L74,60 Z", C.white, 6), at(1500, 900)),
            `<div class="ttl" id="s07-d-logo" style="top:150px;font-size:150px;left:560px;right:0;text-align:center">Randos in 60s</div>` +
            `<div class="ttl" id="s07-d-sub" style="top:330px;font-size:56px;left:560px;right:0;text-align:center;color:#6b665d">more weird stuff about your brain</div>` +
            `<div class="ttl" id="s07-d-bye" style="top:840px;font-size:64px;left:560px;right:0;text-align:center">see you in the next one</div>`);

          S.mount();
          const tl = gsap.timeline({ paused: true });
          const t = { a: 0, b: q("L47"), c: q("L48"), d: q("L49") };
          R.shots(tl, [["#s07-a", 0], ["#s07-b", t.b, "whipL"], ["#s07-c", t.c, "pop"], ["#s07-d", t.d, "pop"]], DUR);
          R.boil(tl, "#s07-cam .boil", "s07", 0, DUR);

          // a — checklist
          R.idle(tl, "s07t", 0, t.b, 71);
          R.pose(tl, "s07t", { armR: 110, foreR: 20 }, 0.2, 0.3);
          [["1", "bring a list"], ["2", "Eat before"], ["3", "top and bottom"], ["4", "price per unit"]].forEach(([k, w]) => {
            gsap.set(`#s07-a-${k}`, { opacity: 0 });
            R.slideIn(tl, `#s07-a-${k}`, q("L46", w) - 0.3, 300, 0, 0.4); sfx("ding", q("L46", w), 0.4);
          });
          R.push(tl, "#s07-a", 0, t.b, 1, 1.04);

          // b — see them coming
          R.idle(tl, "s07b", t.b, t.c, 72);
          tl.fromTo("#s07-b-mag", { x: 0, y: 0 }, { x: 300, y: 200, duration: 2.0, ease: "sine.inOut" }, t.b + 0.2);
          gsap.set(["#s07-b-tags", "#s07-b-tags2"], { opacity: 0 });
          R.pop(tl, "#s07-b-tags", t.b + 0.8); R.pop(tl, "#s07-b-tags2", t.b + 1.8); sfx("pop", t.b + 0.8, 0.5); sfx("pop", t.b + 1.8, 0.5);
          R.expr(tl, "s07b", { brows: "sly", look: [12, -4] }, t.b + 0.2);
          R.push(tl, "#s07-b", t.b, t.c - t.b, 1, 1.05);

          // c — the milk callback
          R.pose(tl, "s07c", { armR: 120, foreR: 30 }, t.c + 0.1, 0.3);
          tl.fromTo("#s07-c-milk", { y: 200, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "back.out(2)" }, t.c + 0.2);
          tl.fromTo("#s07-c-sp", { opacity: 0, scale: 0.5, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, q("L48", "milk") - 0.2);
          sfx("sparkle", q("L48", "milk") - 0.2, 0.6);
          R.expr(tl, "s07c", { eyes: "happy", blush: 1 }, q("L48", "milk"));
          R.push(tl, "#s07-c", t.c, t.d - t.c, 1, 1.08);

          // d — end card
          R.words(tl, "#s07-d-logo", t.d + 0.1, 0.12); sfx("impact", t.d + 0.1, 0.5);
          gsap.set(["#s07-d-sub", "#s07-d-bye", "#s07-d-btn", "#s07-d-bell", "#s07-d-cur"], { opacity: 0 });
          R.fadeIn(tl, "#s07-d-sub", t.d + 0.9);
          const sb = q("L49", "subscribe");
          R.pop(tl, "#s07-d-btn", sb - 0.3); R.pop(tl, "#s07-d-bell", sb - 0.1);
          tl.fromTo("#s07-d-cur", { opacity: 0, x: 300, y: 200 }, { opacity: 1, x: -260, y: -230, duration: 0.7, ease: "power2.out" }, sb);
          const ck = sb + 0.75;
          tl.to("#s07-d-btn", { scale: 0.92, transformOrigin: "50% 50%", duration: 0.08, yoyo: true, repeat: 1 }, ck);
          sfx("click", ck, 0.9);
          tl.set("#s07-d-btn rect", { attr: { fill: "#8C8577" } }, ck + 0.1);
          tl.set("#s07-d-t1", { opacity: 0 }, ck + 0.1).set("#s07-d-t2", { opacity: 1 }, ck + 0.1);
          R.wiggle(tl, "#s07-d-bell", ck + 0.4, 0.8, 18, 0.08); sfx("ding", ck + 0.4, 0.5);
          R.pose(tl, "s07e", { armR: 150, foreR: 30 }, t.d + 0.3, 0.3);
          R.flutter(tl, "s07e", "foreR", 30, t.d + 0.6, 2.4, 20, 0.2);
          R.idle(tl, "s07e", t.d, DUR, 73);
          R.pop(tl, "#s07-d-bye", q("L49", "See you"));
          R.push(tl, "#s07-d", t.d, DUR - t.d, 1, 1.05);

          window.__timelines["s07"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
