      <div id="s03" data-composition-id="s03" data-width="1920" data-height="1080"></div>
      <script>
        (function () {
          /*CUES*/ const CUES = {"L10":[0,11.636,"Scientists started poking at this question back in 1971. A team led by Lawrence Weiskrantz tickled people on the soles of their feet, and confirmed what we all suspected."],"L11":[12.016,14.451,"It really is less ticklish when you do it yourself."],"L11a":[14.951,26.526,"Scientists even have two words for it. Knismesis is the light, feathery, itchy kind. Gargalesis is the heavy, poke-in-the-ribs kind that makes you howl with laughter."],"L11b":[26.906,30.908,"And it's that laughing kind that's nearly impossible to give yourself."],"L12":[31.408,41.099,"But nobody could explain why. Not until 1998, when Sarah-Jayne Blakemore and her colleagues in London took the question inside a brain scanner."],"L13":[41.479,46.95,"Volunteers lay in the scanner while a soft tickling device brushed across the palm of their hand."],"L14":[47.33,52.561,"Sometimes the experimenter moved it. Sometimes the volunteers moved it themselves."],"L15":[53.011,57.328,"When someone else did the tickling, the parts of the brain that process touch lit up."],"L16":[57.709,62.067,"But when the volunteers tickled themselves, those same areas were much quieter."],"L17":[62.517,65.959,"Same touch on the skin. But the brain was barely listening."],"L18":[66.559,74.154,"And there was another clue. A region at the back of the brain, called the cerebellum, behaved differently when people tickled themselves."],"L19":[74.534,82.548,"The cerebellum is famous for coordinating movement. It's the reason you can walk, type, and catch a ball without thinking about it."],"L20":[82.928,87.221,"But the scientists suspected it was doing something else too. Something sneaky."],"L21":[87.921,89.442,"It was predicting the future."]}; const DUR = 90.442; /*ENDCUES*/
          const { C, P, BG, person, text, path, rect, line, circ, ell, g, at } = R;

          const sfx = (n, t, gn) => R.sfx("s03", n, t, gn);

          // a — rewind to 1971
          S.add("a",

          // b — Weiskrantz's 1971 lab: a foot through a curtain

            W("s03-b-foot", P.foot(null, 0, 0, 0.75, -90), at(950, 650)) +

            W("s03-b-feather", P.feather(null, 0, 0, 0.55, 70, C.teal), at(780, 560)) +

          // c — tickliness chart

          // d — knismesis
          S.add("d",

              Array.from({ length: 22 }, (_, i) => circ(320 + i * 60, 620 + (i % 3) * 40, 4, "#D9A889", 0)).join("")) +

            g("s03-d-sq", path("M600,500 q10,-20 20,0 t20,0 t20,0 M1000,480 q10,-20 20,0 t20,0 t20,0 M1300,510 q10,-20 20,0 t20,0", "none", 6, C.ink)),
            `<div class="ttl" id="s03-d-t" style="top:90px;font-size:130px">Knismesis</div>` +

          // e — gargalesis

            g("s03-e-ha", text(420, 380, "HA", 110, C.red) + text(1500, 330, "HAHA", 96, C.orange)),

          // f — can't do it to yourself
          S.add("f",
            BG.paper() +

            BG.lab() +

            person("s03s3", { x: 1400, y: 680, s: 1.1, coat: true, glasses: true, hair: "curly", hairColor: C.ink, shirt: C.green, mouth: "o" }) +
            P.question("s03-g-q1", 520, 230, 0.7) + P.question("s03-g-q2", 960, 210, 0.8, C.red) + P.question("s03-g-q3", 1400, 230, 0.7));

          // h — London, 1998
          S.add("h",

            W("s03-h-ben", P.big_ben(null, 0, 0, 1.6), at(560, 700)) +
            Array.from({ length: 6 }, (_, i) => rect(900 + i * 170, 560 - (i % 3) * 60, 140, 300 + (i % 3) * 60, ["#D8CBB5", "#C9B79C", "#E2D6C2"][i % 3], 6, 7)).join("") +
            W("s03-h-tag", rect(1110, 140, 560, 160, C.white, 24, 8) + text(1390, 222, "LONDON, 1998", 76)));

          // i — Blakemore + brain scanner
          S.add("i",
            BG.lab({ wall: "#E3EEF2" }) +
            W("s03-i-mri", P.mri(null, 0, 0, 1.15), at(1250, 560)) +
            person("s03b", { x: 480, y: 660, s: 1.35, coat: true, hair: "ponytail", hairColor: "#6B3A1E", shirt: C.purple, mouth: "smile" }) +
            W("s03-i-tag", rect(150, 890, 700, 110, C.white, 20, 7) + text(500, 945, "SARAH-JAYNE BLAKEMORE", 54)) +
            W("s03-i-lbl", rect(1050, 110, 520, 100, C.yellow, 20, 7) + text(1310, 160, "BRAIN SCANNER", 60)));

          // j — palm + soft tickling device
          S.add("j",
            BG.flat("#E6E0F5") +
            P.palm("s03-j-palm", 760, 560, 1.4, "#FFE9D6", C.gray) +
            W("s03-j-stick", P.foamStick(null, 0, 0, 1.2, 35), at(980, 520)) +
            g("s03-j-sw", path("M1040,330 q30,-20 60,0 M1060,700 q30,-20 60,0", "none", 6)),
            `<div class="ttl" style="top:60px;font-size:70px;text-align:right;padding-right:120px">soft tickling device</div>`);

          // k — who moves it?
          const panel = (x, label, col, id) =>
            g(id, rect(x - 400, 180, 800, 760, C.white, 30, 8) + P.palm(null, x - 120, 690, 0.8, "#FFE9D6", C.gray) +
              W(`${id}-st`, P.foamStick(null, 0, 0, 0.75, 35) + rect(70, 140, 120, 90, col, 30, 7), at(x + 20, 560)) +
              text(x, 250, label, 56));
          S.add("k",
            BG.paper() + panel(500, "EXPERIMENTER MOVES IT", C.white, "s03-k-p1") + panel(1420, "VOLUNTEER MOVES IT", C.yellow, "s03-k-p2") +
            W("s03-k-hl", rect(80, 160, 840, 800, "none", 36, 14, C.orange)));

          // l — brain monitor: touch areas light up / stay quiet
          S.add("l",
            BG.lab({ wall: "#D7E6EC" }) +

          // m — brain not listening
          S.add("m",
            BG.flat("#FCE9B8") +

            W("s03-m-hand", P.hand(null, 0, 0, 0.9, 180), at(1560, 760)) +
            P.bubble("s03-m-b", 1460, 380, 420, 150, text(0, 4, "hellooo?", 70), "right"));

          // n — the cerebellum
          S.add("n",
            BG.paper() +
            P.brainSide("s03-n-br", 900, 520, 2.0) +
            W("s03-n-ring", ell(1150, 720, 260, 170, "none", 12, C.orange)) +
            W("s03-n-lbl", P.arrow(null, 1500, 300, 1320, 600, 8, C.ink, 60) + text(1560, 250, "CEREBELLUM", 80)) +
            W("s03-n-sub", text(1560, 330, "(latin for \"little brain\")", 44, "#6b665d")));

          // p1/p2/p3 — walk, type, catch
          S.add("p1", BG.outdoor() + P.cloud(null, 500, 200) + P.cloud(null, 1500, 240, 0.8) +
            P.plant(null, 300, 760, 1.4) + person("s03w1", { x: 300, y: 680, s: 1.2 }) +
            text(960, 120, "WALK", 110));
          S.add("p2", BG.room({ wall: "#DCEAF6" }) +
            person("s03w2", { x: 960, y: 620, s: 1.25, mouth: "smile" }) + P.table(null, 960, 690, 900) + W("s03-p2-lap", P.laptop(null, 0, 0, 1.1), at(960, 690)) +
            text(960, 120, "TYPE", 110));
          S.add("p3", BG.outdoor({ sky: "#BFE3F1" }) + person("s03w3", { x: 1200, y: 690, s: 1.25, mouth: "grin" }) +
            W("s03-p3-ball", P.ball(null, 0, 0, 1.2), at(200, 700)) + text(960, 120, "CATCH", 110));

          // q — something sneaky
          S.add("q",
            BG.flat("#1F2440") +
            W("s03-q-spot", ell(960, 960, 520, 90, "#3A4270", 0) + path("M760,-100 L1160,-100 L1480,960 L440,960 Z", "rgba(255,240,180,.18)", 0)) +
            W("s03-q-cb", P.brain("s03-qb", 0, 0, 0.9, { face: true, col: "#E78F9F" }) + P.hat(null, 0, -150, 1.5), at(960, 680)) +
            g("s03-q-steps", text(560, 900, "tip", 50, "#9aa3d6") + text(700, 930, "toe", 50, "#9aa3d6")));

          // r — predicting the future
          S.add("r",
            BG.flat("#2B2552") +
            Array.from({ length: 30 }, (_, i) => { const r = R.rng(i + 90); return circ(r() * 1920, r() * 1080, 2 + r() * 3, "#FFF3C4", 0); }).join("") +
            P.crystal("s03-r-ball", 960, 560, 1.5) +
            W("s03-r-cb", P.brain("s03-rb", 0, 0, 0.5, { face: true, col: "#E78F9F" }), at(960, 550)) +
            g("s03-r-st", P.star(null, 620, 300, 0.8) + P.star(null, 1320, 280, 1) + P.star(null, 1400, 820, 0.7) + P.star(null, 500, 780, 0.6)),
            `<div class="ttl" id="s03-r-t" style="top:880px;font-size:110px;color:#FBF8F1">predicting the future</div>`);

          S.mount();
          const tl = gsap.timeline({ paused: true });
          const t = {
            a: 0, b: q("L10", "A team"), c: q("L11"), d: q("L11a"), e: q("L11a", "Gargalesis"), f: q("L11b"),
            g: q("L12"), h: q("L12", "Not until"), i: q("L12", "took the question"), j: q("L13"), k: q("L14"),
            l: q("L15"), m: q("L17"), n: q("L18"), p1: q("L19", "It's the reason"), p2: q("L19", "type"), p3: q("L19", "catch"),
            q: q("L20"), r: q("L21"),
          };
          t.n0 = q("L18");
          R.shots(tl, [["#s03-a", 0], ["#s03-b", t.b, "whipL"], ["#s03-c", t.c, "pop"], ["#s03-d", t.d, "up"], ["#s03-e", t.e, "whipL"],
            ["#s03-f", t.f, "pop"], ["#s03-g", t.g, "whipL"], ["#s03-h", t.h, "fade"], ["#s03-i", t.i, "whipL"], ["#s03-j", t.j],
            ["#s03-k", t.k, "pop"], ["#s03-l", t.l, "whipL"], ["#s03-m", t.m, "pop"], ["#s03-n", t.n, "whipL"],
            ["#s03-p1", q("L19")], ["#s03-p2", t.p2], ["#s03-p3", t.p3], ["#s03-q", t.q, "fade"], ["#s03-r", t.r, "pop"]], DUR);
          R.boil(tl, "#s03-cam .boil", "s03", 0, DUR);

          // a — rewind
          const yrs = ["2026", "2010", "1995", "1983", "1971"];
          sfx("rewind", 0.1);
          yrs.forEach((y, i) => {
            const tt = 0.15 + i * 0.32;
            tl.fromTo(`#s03-a-y${i}`, { y: -40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.15 }, tt);
            if (i < yrs.length - 1) tl.to(`#s03-a-y${i}`, { opacity: 0, duration: 0.05 }, tt + 0.3);
          });
          sfx("stamp", 0.15 + 4 * 0.32 + 0.05);
          R.punch(tl, "#s03-a-cal", 0.15 + 4 * 0.32, 1.08, 0.2);
          tl.to("#s03-a-clk-min", { rotation: -1440, svgOrigin: "0 0", duration: 1.6, ease: "power2.out" }, 0);
          tl.to("#s03-a-clk-hr", { rotation: -240, svgOrigin: "0 0", duration: 1.6, ease: "power2.out" }, 0);

          R.slideIn(tl, "#s03-b-foot", t.b + 0.3, 200, 0, 0.5); sfx("whoosh", t.b + 0.3, 0.6);
          const tk = q("L10", "tickled");

          sfx("tickle", tk);
          gsap.set(["#s03-b-tag", "#s03-b-ha"], { opacity: 0 });
          R.pop(tl, "#s03-b-tag", q("L10", "Lawrence")); sfx("pop", q("L10", "Lawrence"), 0.5);
          R.pop(tl, "#s03-b-ha", q("L10", "confirmed")); sfx("boing", q("L10", "confirmed"), 0.6);
          R.expr(tl, "s03w", { mouth: "grin", brows: "up" }, q("L10", "confirmed"));
          R.push(tl, "#s03-b", t.b, t.c - t.b, 1, 1.08, 0, 30);

          // c — chart

          tl.fromTo("#s03-c-b2", { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.8, ease: "back.out(1.3)" }, q("L11", "yourself") - 0.3);
          sfx("up", t.c + 0.2, 0.6); sfx("down", q("L11", "yourself") - 0.3, 0.6);
          R.push(tl, "#s03-c", t.c, t.d - t.c, 1, 1.05);

          // d — knismesis

          for (let i = 0; i < Math.floor((t.f - t.e - 0.4) / 0.22); i++)
            R.pose(tl, "s03r", { armL: 140 + (i % 2) * 30, armR: 130 - (i % 2) * 30, foreL: 30, foreR: -30 }, t.e + 0.3 + i * 0.22, 0.2);

          sfx("tickle", t.e + 0.3); sfx("boing", t.e + 0.5, 0.6);
          R.shake(tl, "#s03-e-art", q("L11a", "howl"), 0.5, 14);
          R.push(tl, "#s03-e", t.e, t.f - t.e, 1.02, 1.12);

          // f — self = nope
          R.pose(tl, "s03r2", { armL: 50, foreL: -110, armR: 50, foreR: -110 }, t.f, 0.3);
          R.flutter(tl, "s03r2", "foreL", -110, t.f + 0.4, 1.4, 12, 0.09);
          R.flutter(tl, "s03r2", "foreR", -110, t.f + 0.4, 1.4, 12, 0.09);
          R.expr(tl, "s03r2", { lids: 0.55, brows: "sly" }, t.f + 0.2);
          gsap.set(["#s03-f-b", "#s03-f-tag"], { opacity: 0 });
          R.pop(tl, "#s03-f-b", t.f + 1.2); sfx("pop", t.f + 1.2, 0.5);
          R.pop(tl, "#s03-f-tag", q("L11b", "impossible")); sfx("buzz", q("L11b", "impossible"), 0.5);
          R.push(tl, "#s03-f", t.f, t.g - t.f, 1, 1.08);

          // g — nobody could explain
          ["s03s1", "s03s2", "s03s3"].forEach((id, i) => {
            R.idle(tl, id, t.g, t.h, 10 + i);
            R.pose(tl, id, { armL: 40, foreL: 80, armR: 40, foreR: 80 }, t.g + 0.2 + i * 0.1, 0.3);
          });
          gsap.set(["#s03-g-q1", "#s03-g-q2", "#s03-g-q3"], { opacity: 0 });
          [1, 2, 3].forEach((k, i) => { R.pop(tl, `#s03-g-q${k}`, t.g + 0.5 + i * 0.25); sfx("pop", t.g + 0.5 + i * 0.25, 0.4); });
