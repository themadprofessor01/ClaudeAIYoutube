      <script>
        (function () {
          /*CUES*/ const CUES = {"L22":[0,7.95,"Here's how it works. Every time you decide to move, your brain sends a command to your muscles. Lift. Move left. Press down."],"L23":[8.33,17.106,"But it also keeps a copy of that command. Scientists call it an efference copy. Think of it like the carbon copy of an email you just sent."],"L24":[17.486,23.842,"Your brain uses that copy to run a quick simulation. If I do this, here's exactly what I should feel."],"L25":[24.292,30.223,"Then the real sensation arrives, and the brain compares the two. Prediction, versus reality."],"L26":[30.723,37.289,"If they match, the brain basically says, that was just me, nothing to see here. And it turns the volume down."],"L27":[37.669,42.643,"If they don't match, that's a surprise. And surprises get the brain's full attention."],"L28":[43.143,50.982,"A tickle from someone else is pure surprise. You can't predict exactly where their fingers will go next, how hard, or how fast."],"L29":[51.362,58.02,"But your own fingers? Your brain knows the plan before your hand even moves. There's no surprise left to feel."],"L30":[58.72,61.156,"And the researchers proved it, with robots."],"L31":[61.536,69.585,"Volunteers moved a robot arm with one hand, and a second robot brushed the palm of their other hand. Normally, this felt pretty dull."],"L32":[69.965,75.529,"But then the scientists secretly added a delay. Just a tenth of a second. Then two tenths."],"L33":[75.909,79.429,"And suddenly, the volunteers' own touch started feeling tickly."],"L34":[79.929,89.061,"They also twisted the direction, so the robot moved a little differently from the hand. Same result. The bigger the mismatch, the more ticklish it felt."],"L35":[89.561,93.901,"So it's not about who is touching you. It's about whether your brain saw it coming."]}; const DUR = 94.901; /*ENDCUES*/

          R.push(tl, "#s04-g", t.g, t.h - t.g, 1, 1.07);

          // h — your plan
          gsap.set(["#s04-h-th", "#s04-h-ns"], { opacity: 0 });
          R.pop(tl, "#s04-h-th", t.h + 0.4); sfx("pop", t.h + 0.4, 0.5);
          R.draw(tl, "#s04-h-path", q("L29", "knows the plan"), 0.8);
          const hp2 = [[900, 700], [1100, 600], [1250, 760], [1400, 640], [1580, 600], [1700, 700]];
          const hs = q("L29", "before your hand");
          hp2.forEach(([x, y], i) => tl.to("#s04-h-hand", { x: x - 900, y: y - 700, duration: 0.4, ease: "none" }, hs + i * 0.4));
          R.expr(tl, "s04h", { lids: 0.55, look: [10, 6] }, t.h + 0.2);
          R.pop(tl, "#s04-h-ns", q("L29", "no surprise")); sfx("buzz", q("L29", "no surprise"), 0.4);
          R.push(tl, "#s04-h", t.h, t.i - t.h, 1, 1.06);

          // i — robots
          R.words(tl, "#s04-i-t", t.i + 0.2, 0.1);
          tl.fromTo("#s04-ia", { y: 600 }, { y: 0, duration: 0.5, ease: "back.out(1.4)" }, t.i);
          tl.fromTo("#s04-ib", { y: 600 }, { y: 0, duration: 0.5, ease: "back.out(1.4)" }, t.i + 0.15);
          sfx("robot", t.i + 0.3, 0.7); sfx("sparkle", t.i + 0.5, 0.5);
          R.wiggle(tl, "#s04-ia-armL", t.i + 0.6, 1.6, 20, 0.2, "100% 0%");
          R.wiggle(tl, "#s04-ib-armR", t.i + 0.6, 1.6, 20, 0.2, "0% 0%");
          tl.fromTo("#s04-i-sp", { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, t.i + 0.4);
          R.push(tl, "#s04-i", t.i, t.j - t.i, 1, 1.06);

          // j — setup, then delay
          gsap.set(["#s04-j-sw", "#s04-j-d1", "#s04-j-d2", "#s04-j-pulse"], { opacity: 0 });
          const loop = (t0, n, lag) => {
            for (let i = 0; i < n; i++) {
              const tt = t0 + i * 1.3;
              tl.to("#s04-j-lh", { x: 40, y: -30, duration: 0.3, ease: "sine.inOut" }, tt);

              tl.set("#s04-j-pulse", { opacity: 1, x: 0, y: 0 }, tt);
              tl.to("#s04-j-pulse", { x: 600, duration: 0.25 + lag * 3, ease: "none" }, tt);
              tl.set("#s04-j-pulse", { opacity: 0 }, tt + 0.26 + lag * 3);
              tl.to("#s04-j-stick", { x: -40, y: 30, duration: 0.3, ease: "sine.inOut" }, tt + lag + 0.1);
              tl.to("#s04-j-stick", { x: 0, y: 0, duration: 0.3, ease: "sine.inOut" }, tt + lag + 0.45);
            }
          };
          loop(t.j + 0.8, 6, 0);
          R.slideIn(tl, "#s04-j-meh", q("L31", "Normally"), 200, 0, 0.4);
          sfx("beep", q("L31", "robot arm"), 0.4);
          const dl = q("L32");
          R.pop(tl, "#s04-j-sw", dl + 0.2); sfx("tick", dl + 0.2, 0.6);
          R.pop(tl, "#s04-j-d1", q("L32", "tenth")); sfx("pop", q("L32", "tenth"), 0.5);
          tl.to("#s04-j-sw-hand", { rotation: 36, svgOrigin: "0 0", duration: 0.4 }, q("L32", "tenth"));
          tl.to("#s04-j-d1", { opacity: 0, duration: 0.1 }, q("L32", "Then two"));
          R.pop(tl, "#s04-j-d2", q("L32", "Then two")); sfx("pop", q("L32", "Then two"), 0.5);
          tl.to("#s04-j-sw-hand", { rotation: 72, svgOrigin: "0 0", duration: 0.4 }, q("L32", "Then two"));
          loop(q("L32", "tenth"), 4, 0.2);
          R.push(tl, "#s04-j", t.j, t.l - t.j, 1, 1.07);

          // l — tickly
          gsap.set("#s04-l-hee", { opacity: 0 });
          tl.fromTo("#s04-l-m-fill", { scaleY: 0.08, transformOrigin: "50% 100%" }, { scaleY: 0.9, duration: 2.0, ease: "power2.inOut" }, t.l + 0.4);
          sfx("up", t.l + 0.4, 0.6);
          R.expr(tl, "s04l", { lids: 0.6 }, t.l);
          const gg = q("L33", "tickly");
          R.laugh(tl, "s04l", gg - 0.3, t.m - gg + 0.1, 0.7);
          R.pop(tl, "#s04-l-hee", gg - 0.2); sfx("tickle", gg - 0.2, 0.7);
          R.push(tl, "#s04-l", t.l, t.m - t.l, 1, 1.08);

          // m — twist the direction
          const tw1 = q("L34", "twisted"), mm = q("L34", "The bigger");
          R.draw(tl, "#s04-m-a1 path", t.m + 0.3, 0.4);
          tl.fromTo("#s04-m-a2", { rotation: 0, transformOrigin: "50% 50%" }, { rotation: -25, transformOrigin: "50% 50%", duration: 0.5, ease: "back.out(2)" }, tw1 + 0.2);
          tl.to("#s04-m-a2", { rotation: -50, transformOrigin: "50% 50%", duration: 0.5, ease: "back.out(2)" }, tw1 + 1.6);
          sfx("swish", tw1 + 0.2, 0.5); sfx("swish", tw1 + 1.6, 0.5);
          R.draw(tl, "#s04-m-curve", mm - 0.2, 1.6, "power1.in");
          sfx("up", mm - 0.2, 0.6);
          R.push(tl, "#s04-m", t.m, t.n - t.m, 1, 1.05);

          // n — takeaway
          R.slideIn(tl, "#s04-n-t1", t.n + 0.1, 0, 50, 0.45);
          tl.fromTo("#s04-n-strike", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, q("L35", "It's about") - 0.4); sfx("swish", q("L35", "It's about") - 0.4, 0.5);
          tl.to("#s04-n-t1", { opacity: 0.35, duration: 0.3 }, q("L35", "It's about"));
          R.words(tl, "#s04-n-t2", q("L35", "It's about"), 0.08);
          R.words(tl, "#s04-n-t3", q("L35", "saw it"), 0.1, { y: 60 }); sfx("impact", q("L35", "saw it"), 0.7);
          gsap.set("#s04-n-eye", { opacity: 0 });
          R.pop(tl, "#s04-n-eye", q("L35", "saw it") + 0.2);
          tl.to("#s04-n-eyeA-iris", { x: -120, duration: 0.25 }, q("L35", "saw it") + 0.8).to("#s04-n-eyeA-iris", { x: 120, duration: 0.3 }, q("L35", "saw it") + 1.3);
          R.push(tl, "#s04-n", t.n, DUR - t.n, 1, 1.06);

          window.__timelines["s04"] = tl;
        })();
      </script>
