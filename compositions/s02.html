<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "HandSC"; src: url("assets/fonts/PatrickHandSC.woff2") format("woff2"); }
        #s02-cam { position: absolute; inset: 0; overflow: hidden; background: #FBF8F1; }
        #s02-cam .shot { position: absolute; inset: 0; visibility: hidden; }
        #s02-cam .shot > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
        #s02-cam .ttl { position: absolute; left: 0; right: 0; text-align: center; font-family: "HandSC", cursive; color: #272320; }
      </style>
      <div id="s02" data-composition-id="s02" data-width="1920" data-height="1080"></div>
      <script>
        (function () {
          /*CUES*/ const CUES = {"L06":[0,5.579,"The average American supermarket carries more than thirty thousand different products. Thirty thousand.",[["The",0.299],["average",0.469],["American",0.853],["supermarket",1.195],["carries",1.877],["more",2.219],["than",2.389],["thirty",2.517],["thousand",2.944],["different",3.413],["products.",3.669],["Thirty",4.608],["thousand.",5.035]]],"L07":[6.079,11.891,"No brain can carefully think through that many choices. So it doesn't. It switches to autopilot.",[["No",6.378],["brain",6.591],["can",6.89],["carefully",7.06],["think",7.487],["through",7.786],["that",7.956],["many",8.127],["choices.",8.34],["So",9.364],["it",9.578],["doesn't.",9.663],["It",10.602],["switches",10.73],["to",11.071],["autopilot.",11.199]]],"L08":[12.271,16.441,"And supermarkets have spent decades learning exactly how to steer that autopilot.",[["And",12.527],["supermarkets",12.698],["have",13.295],["spent",13.423],["decades",13.722],["learning",14.234],["exactly",14.575],["how",15.002],["to",15.13],["steer",15.258],["that",15.599],["autopilot.",15.77]]],"L09":[17.041,20.394,"So, how do supermarkets trick your brain into spending more?",[["So,",17.336],["how",17.72],["do",18.104],["supermarkets",18.189],["trick",18.786],["your",19.085],["brain",19.213],["into",19.469],["spending",19.682],["more?",20.109]]]}; const DUR = 21.494; /*ENDCUES*/
          const { C, P, BG, person, text, path, rect, line, circ, ell, g, at } = R;
          const q = R.cue(CUES);
          const S = R.scene("s02");
          const sfx = (n, t, gn) => R.sfx("s02", n, t, gn);
          const W = (id, inner, tr) => g(null, g(id, inner), tr);
          const nums = ["5,000", "12,000", "19,000", "26,000", "30,000+"];

          // a — thirty thousand products
          S.add("a",
            BG.store() +
            W("s02-a-wall", Array.from({ length: 5 }, (_, i) => P.shelf(null, -200 + i * 1000, 170, 980, 620, 4, i + 3)).join("")) +
            person("s02r", { x: 960, y: 760, s: 1.0, mouth: "o" }) +
            P.cart(null, 1180, 940, 0.7) +
            W("s02-a-n", rect(-360, -90, 720, 180, C.yellow, 30, 9) +
              nums.map((n, i) => `<g id="s02-a-n${i}" opacity="0">${text(0, 6, n, 120)}</g>`).join(""), at(960, 120)));

          // b — overwhelmed brain → autopilot
          S.add("b",
            BG.flat("#EDE6F7") +
            P.brain("s02-bb", 700, 560, 1.15, { face: true }) +
            W("s02-b-cap", P.pilotCap(null, 0, 0, 1.6), at(700, 380)) +
            g("s02-b-q", P.question(null, 380, 260, 0.6) + P.question(null, 1000, 250, 0.7, C.red) + P.question(null, 1060, 760, 0.5)) +
            W("s02-b-sw", rect(-210, -110, 420, 220, C.white, 30, 8) + text(-100, -150, "MANUAL", 44) + text(110, -150, "AUTOPILOT", 44, C.purple) +
              rect(-150, -40, 300, 80, C.gray2, 40, 6) + `<g id="s02-b-knob">${circ(-100, 0, 46, C.red, 7)}</g>`, at(1440, 560)));

          // c — the store steers the autopilot
          const route = "M140,840 C400,640 600,940 860,700 S1240,320 1480,520 S1760,760 1820,300";
          S.add("c",
            BG.flat("#DDF0F7") +
            Array.from({ length: 4 }, (_, i) => P.shelf(null, 160 + i * 440, 120, 300, 300, 2, 30 + i)).join("") +
            path(route, "none", 8, C.purple, `id="s02-c-route" stroke-dasharray="18 16"`) +
            W("s02-c-brain", P.brain(null, 0, 0, 0.35, { face: true }) + P.pilotCap(null, 0, -50, 0.5), at(140, 840)) +
            W("s02-c-sign", rect(-230, -60, 460, 120, C.red, 20, 7) + text(0, 4, "THIS WAY →", 60, C.white), at(1500, 900)));

          // d — title card
          S.add("d",
            BG.paper() +
            Array.from({ length: 10 }, (_, i) => circ(140 + i * 190, i % 2 ? 990 : 100, 12, C.gray2, 0)).join("") +
            W("s02-d-cart", P.cart(null, 0, 0, 0.9) + P.chips(null, -60, -200, 0.6) + P.candle(null, 40, -190, 0.6) + P.product(null, 110, -180, 0.5, "box", C.blue), at(1600, 940)) +
            g("s02-d-ul", path("M300,780 Q960,740 1620,780", "none", 14, C.orange)),
            `<div class="ttl" id="s02-d-t1" style="top:230px;font-size:130px">how supermarkets</div>` +
            `<div class="ttl" id="s02-d-t2" style="top:390px;font-size:160px;color:#E4483B">trick your brain</div>` +
            `<div class="ttl" id="s02-d-t3" style="top:600px;font-size:84px">into spending more</div>` +
            `<div class="ttl" id="s02-d-bug" style="top:960px;font-size:44px;color:#8a8478">randos in 60s</div>`);

          S.mount();
          const tl = gsap.timeline({ paused: true });
          const t = { b: q("L07"), c: q("L08"), d: q("L09") };
          R.shots(tl, [["#s02-a", 0], ["#s02-b", t.b, "pop"], ["#s02-c", t.c, "whipL"], ["#s02-d", t.d, "pop"]], DUR);
          R.boil(tl, "#s02-cam .boil", "s02", 0, DUR);

          // a — endless shelves + counter
          tl.fromTo("#s02-a-wall", { x: 0 }, { x: -3000, duration: t.b, ease: "power1.in" }, 0);
          nums.forEach((n, i) => {
            const tt = 0.3 + i * 0.45;
            tl.set(`#s02-a-n${i}`, { opacity: 1 }, tt);
            if (i < nums.length - 1) tl.set(`#s02-a-n${i}`, { opacity: 0 }, tt + 0.45);
            sfx("tick", tt, 0.5);
          });
          R.punch(tl, "#s02-a-n", 0.3 + 4 * 0.45, 1.15, 0.3); sfx("impact", 0.3 + 4 * 0.45, 0.6);
          R.shake(tl, "#s02-a-n", q("L06", "Thirty thousand."), 0.4, 10); sfx("thud", q("L06", "Thirty thousand."), 0.6);
          R.expr(tl, "s02r", { brows: "worried", look: [-10, -6] }, 0.4);
          for (let i = 0; i < 6; i++) R.expr(tl, "s02r", { look: [i % 2 ? 12 : -12, -6] }, 0.8 + i * 0.7);
          R.push(tl, "#s02-a", 0, t.b, 1, 1.06);

          // b — overwhelmed, then autopilot
          gsap.set(["#s02-b-cap"], { opacity: 0 });
          tl.set("#s02-bb-m-smile", { opacity: 0 }, t.b).set("#s02-bb-m-o", { opacity: 1 }, t.b);
          R.wiggle(tl, "#s02-bb", t.b + 0.2, q("L07", "So it doesn't") - t.b, 5, 0.08);
          tl.fromTo("#s02-b-q", { opacity: 0, scale: 0.5, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.4 }, t.b + 0.3);
          const ap = q("L07", "autopilot");
          tl.to("#s02-b-knob", { x: 200, duration: 0.25, ease: "back.out(2)" }, ap - 0.2);
          tl.to("#s02-b-knob circle", { attr: { fill: C.green }, duration: 0.1 }, ap - 0.1);
          sfx("click", ap - 0.2, 0.9); sfx("swell", ap, 0.4);
          tl.to("#s02-b-q", { opacity: 0, duration: 0.3 }, ap);
          tl.fromTo("#s02-b-cap", { y: -400, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "bounce.out" }, ap + 0.1);
          tl.set("#s02-bb-m-o", { opacity: 0 }, ap + 0.3).set("#s02-bb-m-smile", { opacity: 1 }, ap + 0.3);
          R.push(tl, "#s02-b", t.b, t.c - t.b, 1, 1.06);

          // c — steering
          R.draw(tl, "#s02-c-route", t.c + 0.2, 1.2);
          const rp = [[140, 840], [500, 760], [860, 700], [1200, 420], [1480, 520], [1700, 640], [1820, 300]];
          rp.slice(1).forEach(([x, y], i) => tl.to("#s02-c-brain", { x: x - 140, y: y - 840, duration: 0.6, ease: "sine.inOut" }, t.c + 1.2 + i * 0.6));
          gsap.set("#s02-c-sign", { opacity: 0 });
          R.pop(tl, "#s02-c-sign", q("L08", "steer") - 0.3); sfx("pop", q("L08", "steer") - 0.3, 0.6);
          R.wiggle(tl, "#s02-c-sign", q("L08", "steer"), 1.2, 4, 0.15);
          sfx("whoosh", t.c + 1.2, 0.4);
          R.push(tl, "#s02-c", t.c, t.d - t.c, 1, 1.06);

          // d — title
          sfx("riser", t.d - 2.0, 0.4);
          R.words(tl, "#s02-d-t1", t.d, 0.08); sfx("whoosh", t.d, 0.5);
          R.words(tl, "#s02-d-t2", q("L09", "trick"), 0.12, { y: 80, rot: 8 }); sfx("impact", q("L09", "trick"));
          R.words(tl, "#s02-d-t3", q("L09", "spending") - 0.2, 0.08);
          R.draw(tl, "#s02-d-ul path", q("L09", "spending"), 0.5);
          R.fadeIn(tl, "#s02-d-bug", t.d + 0.8);
          tl.fromTo("#s02-d-cart", { x: 500 }, { x: 0, duration: 0.7, ease: "back.out(1.4)" }, t.d + 0.4);
          R.push(tl, "#s02-d", t.d, DUR - t.d, 1, 1.06);

          window.__timelines["s02"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
