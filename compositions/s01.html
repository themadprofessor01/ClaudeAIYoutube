<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "HandSC"; src: url("assets/fonts/PatrickHandSC.woff2") format("woff2"); }
        #s01-cam { position: absolute; inset: 0; overflow: hidden; background: #FBF8F1; }
        #s01-cam .shot { position: absolute; inset: 0; visibility: hidden; }
        #s01-cam .shot > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
        #s01-cam .ttl { position: absolute; left: 0; right: 0; text-align: center; font-family: "HandSC", cursive; color: #272320; }
      </style>
      <div id="s01" data-composition-id="s01" data-width="1920" data-height="1080"></div>
      <script>
        (function () {
          /*CUES*/ const CUES = {"L01":[0.5,3.465,"You walk into a supermarket for one thing. Milk."],"L02":[3.965,10.282,"Twenty minutes later, you're at the checkout with snacks, a scented candle, two bags of chips, and somehow, no milk."],"L03":[10.882,13.896,"That's not bad luck. And it's not a lack of willpower."],"L04":[14.276,24.056,"From the moment you walk in, almost everything around you has been designed to get you to spend more. The music. The smells. Even the numbers on the price tags."],"L05":[24.506,27.998,"And most of it works on a part of your brain you don't even notice."]}; const DUR = 28.798; /*ENDCUES*/
          const { C, P, BG, person, text, path, rect, line, circ, ell, g, at } = R;
          const q = R.cue(CUES);
          const S = R.scene("s01");
          const sfx = (n, t, gn) => R.sfx("s01", n, t, gn);
          const W = (id, inner, tr) => g(null, g(id, inner), tr);
          const lbl = (id, x, y, w, s, fill = C.white, col = C.ink, size = 60) =>
            W(id, rect(-w / 2, -50, w, 100, fill, 22, 7) + text(0, 4, s, size, col), at(x, y));

          // a — walking in for milk
          S.add("a",
            BG.outdoor({ sky: "#BFE3F1", ground: "#C9C3B6", hy: 820 }) + P.cloud(null, 300, 170) + P.sun(null, 1700, 150, 0.8) +
            P.storefront("s01-a-store", 1180, 820, 1.0) +
            person("s01r", { x: 380, y: 650, s: 1.35, mouth: "smile" }) +
            P.thought("s01-a-th", 640, 230, 300, 230, P.product(null, 0, 80, 0.85, "milk")),
            `<div class="ttl" id="s01-a-t" style="top:860px;font-size:150px">milk.</div>`);

          // b — twenty minutes later
          S.add("b",
            BG.store() + P.checkout("s01-b-co", 1380, 900, 1.0) +
            person("s01b", { x: 520, y: 650, s: 1.3, mouth: "smile" }) +
            W("s01-b-cart", P.cart(null, 0, 0, 1.15) + g("s01-b-items",
              P.chips(null, -110, -240, 0.9, C.orange) + P.chips(null, 0, -250, 0.9, C.red) + P.candle(null, 100, -240, 0.9) +
              P.product(null, -60, -170, 0.7, "box", C.purple, "SNAX") + P.product(null, 60, -180, 0.7, "can", C.green)), at(880, 820)) +
            lbl("s01-b-time", 960, 120, 680, "20 MINUTES LATER...", C.yellow, C.ink, 64) +
            P.thought("s01-b-th", 280, 220, 260, 210, P.product(null, 0, 80, 0.75, "milk") + P.cross(null, 0, 0, 1.4)));

          // c — not bad luck, not willpower
          S.add("c",
            BG.paper() +
            lbl("s01-c-1", 900, 380, 760, "BAD LUCK", C.white, C.ink, 80) + P.cross("s01-c-x1", 1380, 380, 1.1) +
            lbl("s01-c-2", 900, 620, 760, "NO WILLPOWER", C.white, C.ink, 80) + P.cross("s01-c-x2", 1380, 620, 1.1));

          // d — the store is designed
          S.add("d",
            BG.flat("#2E5E8C") +
            Array.from({ length: 20 }, (_, i) => line(i * 100, 0, i * 100, 1080, 2, "rgba(255,255,255,.12)")).join("") +
            Array.from({ length: 11 }, (_, i) => line(0, i * 100, 1920, i * 100, 2, "rgba(255,255,255,.12)")).join("") +
            rect(260, 160, 1400, 760, "none", 8, 10, "#DDEBFA") +
            Array.from({ length: 5 }, (_, i) => rect(560 + i * 190, 380, 80, 340, "rgba(221,235,250,.25)", 6, 6, "#DDEBFA")).join("") +
            rect(300, 200, 1320, 60, "rgba(221,235,250,.25)", 6, 6, "#DDEBFA") + text(960, 232, "DAIRY", 40, "#DDEBFA") +
            rect(860, 900, 200, 40, "#2E5E8C", 0, 0) + text(960, 980, "ENTRANCE", 40, "#DDEBFA") +
            path("M960,920 L960,820 L420,820 L420,320 L1500,320 L1500,820 L1700,820", "none", 8, C.yellow, `id="s01-d-path" stroke-dasharray="20 16"`) +
            W("s01-d-dot", circ(0, 0, 22, C.orange, 6), at(960, 920)),
            `<div class="ttl" id="s01-d-t" style="top:40px;font-size:84px;color:#DDEBFA">designed to make you spend</div>`);

          // e — music, smells, numbers
          S.add("e",
            BG.paper() +
            W("s01-e-1", circ(0, 0, 190, "#E6E0F5", 0) + P.note(null, -50, 0, 2.2, C.purple) + P.note(null, 60, -30, 1.6, C.purple), at(420, 480)) +
            W("s01-e-2", circ(0, 0, 190, "#FCE9C8", 0) + P.bread(null, 0, 60, 1.1) + path("M-40,-90 q-15,-30 0,-60 t0,-60 M10,-90 q-15,-30 0,-60 t0,-60 M60,-90 q-15,-30 0,-60 t0,-60", "none", 7, "#C9A06A"), at(960, 480)) +
            W("s01-e-3", circ(0, 0, 190, "#FFF1C4", 0) + P.priceTag(null, 0, 0, 1.0, "$2.99"), at(1500, 480)) +
            text(420, 760, "THE MUSIC", 64) + text(960, 760, "THE SMELLS", 64) + text(1500, 760, "THE NUMBERS", 64));

          // f — a part of your brain you don't notice
          S.add("f",
            BG.flat("#1F2440") +
            person("s01h", { x: 960, y: 1560, s: 3.6, mouth: "flat" }) +
            g("s01-f-xray", circ(960, 786, 200, "#2D3460", 0) + P.brain("s01-fb", 960, 810, 0.8, { face: true }) +
              P.pilotCap(null, 960, 680, 1.0)),
            `<div class="ttl" id="s01-f-t" style="top:60px;font-size:96px;color:#FBF8F1">autopilot</div>`);

          S.mount();
          const tl = gsap.timeline({ paused: true });
          const t = { b: q("L02"), c: q("L03"), d: q("L04"), e: q("L04", "The music"), f: q("L05") };
          R.shots(tl, [["#s01-a", 0], ["#s01-b", t.b, "whipL"], ["#s01-c", t.c, "pop"], ["#s01-d", t.d, "fade"], ["#s01-e", t.e, "pop"], ["#s01-f", t.f, "fade"]], DUR);
          R.boil(tl, "#s01-cam .boil", "s01", 0, DUR);

          // a
          gsap.set(["#s01-a-th", "#s01-a-t"], { opacity: 0 });
          tl.fromTo("#s01r", { x: -400 }, { x: 0, duration: 1.4, ease: "power1.out" }, 0);
          R.walk(tl, "s01r", 0, 1.4, 0.3, 24);
          sfx("whoosh", 0.1, 0.4);
          R.pop(tl, "#s01-a-th", q("L01", "Milk") - 0.3); sfx("pop", q("L01", "Milk") - 0.3);
          R.words(tl, "#s01-a-t", q("L01", "Milk"), 0.1, { y: 80 }); sfx("impact", q("L01", "Milk"), 0.7);
          R.expr(tl, "s01r", { look: [8, -8] }, q("L01", "Milk") - 0.3);
          R.push(tl, "#s01-a", 0, t.b, 1, 1.08);

          // b
          gsap.set(["#s01-b-time", "#s01-b-th"], { opacity: 0 });
          R.pop(tl, "#s01-b-time", t.b + 0.05); sfx("whoosh", t.b, 0.6); sfx("tick", t.b + 0.2, 0.6);
          tl.to("#s01-b-time", { opacity: 0, duration: 0.3 }, t.b + 1.6);
          tl.fromTo("#s01-b-cart", { x: -700 }, { x: 0, duration: 0.8, ease: "power2.out" }, t.b + 0.2);
          tl.fromTo("#s01b", { x: -700 }, { x: 0, duration: 0.8, ease: "power2.out" }, t.b + 0.2);
          R.walk(tl, "s01b", t.b + 0.2, 0.8, 0.2, 20);
          R.pose(tl, "s01b", { armR: 70, foreR: 10 }, t.b + 1.1, 0.2);
          ["snacks", "candle", "two bags"].forEach((w) => sfx("pop", q("L02", w), 0.5));
          tl.fromTo("#s01-b-items > g > g", { y: -60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, stagger: 0.25, ease: "back.out(2)" }, q("L02", "snacks"));
          R.pop(tl, "#s01-b-th", q("L02", "no milk") - 0.2); sfx("buzz", q("L02", "no milk"), 0.6);
          R.expr(tl, "s01b", { mouth: "O", brows: "up", sweat: 1 }, q("L02", "no milk"));
          R.shake(tl, "#s01-b-th", q("L02", "no milk") + 0.2, 0.4, 10);
          R.push(tl, "#s01-b", t.b, t.c - t.b, 1, 1.07);

          // c
          gsap.set(["#s01-c-1", "#s01-c-2", "#s01-c-x1", "#s01-c-x2"], { opacity: 0 });
          R.pop(tl, "#s01-c-1", q("L03", "bad luck") - 0.3); R.pop(tl, "#s01-c-x1", q("L03", "bad luck") + 0.3); sfx("buzz", q("L03", "bad luck") + 0.3, 0.5);
          R.pop(tl, "#s01-c-2", q("L03", "willpower") - 0.3); R.pop(tl, "#s01-c-x2", q("L03", "willpower") + 0.3); sfx("buzz", q("L03", "willpower") + 0.3, 0.5);
          R.push(tl, "#s01-c", t.c, t.d - t.c, 1, 1.05);

          // d
          R.words(tl, "#s01-d-t", t.d + 0.2, 0.09);
          R.draw(tl, "#s01-d-path", t.d + 0.6, t.e - t.d - 1.0, "none");
          const pts = [[960, 920], [960, 820], [420, 820], [420, 320], [1500, 320], [1500, 820], [1700, 820]];
          const lens = pts.slice(1).map(([x, y], i) => Math.hypot(x - pts[i][0], y - pts[i][1]));
          const tot = lens.reduce((a, b) => a + b, 0);
          let acc = t.d + 0.6;
          pts.slice(1).forEach(([x, y], i) => { const dd = (lens[i] / tot) * (t.e - t.d - 1.0); tl.to("#s01-d-dot", { x: x - 960, y: y - 920, duration: dd, ease: "none" }, acc); acc += dd; });
          sfx("swell", t.d, 0.4);
          R.push(tl, "#s01-d", t.d, t.e - t.d, 1, 1.06);

          // e
          [["1", "music"], ["2", "smells"], ["3", "price tags"]].forEach(([k, w]) => { gsap.set(`#s01-e-${k}`, { opacity: 0 }); R.pop(tl, `#s01-e-${k}`, q("L04", w) - 0.2); sfx("pop", q("L04", w) - 0.2, 0.6); });
          R.wiggle(tl, "#s01-e-1", q("L04", "music"), 1.2, 6, 0.2);
          R.push(tl, "#s01-e", t.e, t.f - t.e, 1, 1.06);

          // f
          gsap.set(["#s01-f-xray", "#s01-f-t"], { opacity: 0 });
          tl.fromTo("#s01-f-xray", { opacity: 0, scale: 0.5, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, t.f + 0.3);
          sfx("sparkle", t.f + 0.3, 0.5); sfx("riser", DUR - 2.3, 0.5);
          R.fadeIn(tl, "#s01-f-t", q("L05", "don't even notice") - 0.2);
          tl.to("#s01-fb-pupils", { x: -12, duration: 0.3, yoyo: true, repeat: 3 }, t.f + 1.0);
          R.push(tl, "#s01-f", t.f, DUR - t.f, 1, 1.1);

          window.__timelines["s01"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
